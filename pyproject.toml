[project]
name = "vecsearch"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Amodh Dhakal", email = "amodhakal@gmail.com" }]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5",
]

[project.scripts]
vecsearch = "vecsearch:main"
vecsearch-bench = "vecsearch.bench:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
